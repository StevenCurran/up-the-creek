name: Padel Scraper

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 mins
  workflow_dispatch:      # Allows manual trigger
  push:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions: # <--- Add this section
      contents: read    # Required to checkout code
      actions: write    # Required to delete caches
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 1. RESTORE PREVIOUS DATA
      - name: Restore Previous Schedule
        uses: actions/cache/restore@v4
        with:
          path: last_schedule.txt
          key: padel-data-${{ github.run_id }}
          restore-keys: |
            padel-data-

      - name: Run Scraper
        env:
          EMAIL: ${{ secrets.PLAYTOMIC_EMAIL }}
          PASSWORD: ${{ secrets.PLAYTOMIC_PASSWORD }}
          PUB_TOPIC: ${{ secrets.PUB_TOPIC }}
        run: |
          # Run the scraper and save output to a temp file
          ./gradlew run --quiet | tee current_output.txt
          
          # 2. COMPARE DATA
          if [ -f last_schedule.txt ] && cmp -s current_output.txt last_schedule.txt; then
            echo "No changes found. Skipping notification."
          else
            echo "Changes detected or first run. Sending notification."
            # Move current to last_schedule so it gets cached
            cp current_output.txt last_schedule.txt
          fi

      # 3. SAVE DATA FOR NEXT RUN
      - name: Save Current Schedule to Cache
        uses: actions/cache/save@v4
        with:
          path: last_schedule.txt
          key: padel-data-${{ github.run_id }}

            # 4. CLEAN UP OLD CACHES
      - name: Cleanup Old Cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old padel-data caches..."
          # Get the list of IDs, filtering out the current run's cache key
          CACHE_IDS=$(gh cache list --key "padel-data-" --limit 100 --json key,id | \
            jq -r '.[] | select(.key != "padel-data-${{ github.run_id }}") | .id')
          
          if [ -z "$CACHE_IDS" ]; then
            echo "No old caches found."
          else
            for id in $CACHE_IDS; do
              echo "Deleting cache ID: $id"
              gh cache delete "$id" || echo "Couldn't delete $id (it might already be gone)"
            done
          fi